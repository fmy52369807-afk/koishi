    defaultModel: DeepSeek/deepseek-v4-flash
    defaultChatMode: chat
    defaultEmbeddings: DeepSeek
    defaultVectorStore: memory
    defaultPreset: 爱尔奎特
    allowQuoteReply: true
    infiniteContext: true
    isLog: true
  chatluna-openai-like-adapter:7u5fjx:
    platform: DeepSeek
    apiKeys:
      - - ${{ env.DEEPSEEK_API_KEY }}
        - https://api.deepseek.com/v1
    pullModels: false
    maxContextRatio: 1
    additionalModels:
      - model: deepseek-v4-flash
        contextSize: 128000
        modelCapabilities:
          - tool_call
  ~chatluna-character:u0qenu:
    applyPrivate:
      - null
    globalGroupConfig:
      image: true
      model: DeepSeek/deepseek-v4-flash
    globalPrivateConfig:
      model: DeepSeek/deepseek-v4-flash
  activelink:h42txt:
    scope:
      mode: 白名单
      list:
        - type: 群聊
          id: ${{ env.ACTIVELINK_GROUP_ID_1 }}
    proactive:
      enabled: true
      prompts:
        - 像群友一样自然插一句。只接一个最近的话题，可以好奇、吐槽、接梗或轻轻追问，不要总结聊天记录
      initialProbability: 0.2
      checkInterval: 10
      initialDelay: 1
    activityIdle:
      enabled: true
      applyDefaultGroupConfigs:
        - ${{ env.ACTIVELINK_GROUP_ID_1 }}
      groupConfigs:
        - guildId: default
          enableActivityTrigger: true
          activityLowerLimit: 0.85
          activityUpperLimit: 0.85
          activityMessageInterval: 12
          enableIdleTrigger: false
          historyMessageLimit: 20
          cooldownSeconds: 300
          activityPromptTemplate: >-
            你现在要像群友一样自然地插一句，不是回应命令，也不是做总结。

            当前时间：{date} {time}

            群聊：{group_name}


            下面是最近的群聊记录：

            {history}


            请先判断这些话里有没有一个适合自然接上的切入口。

            如果没有合适切入点，可以只输出空消息。

            如果开口，只能选一个最近的话题，优先接最后 1 到 3 条里最自然的一句。

            像爱尔奎特本人一样随口说一句：可以好奇、吐槽、接梗、轻轻追问，但不要同时回应多个话题。

            回复要短，通常 8 到 55
            个汉字左右，完整表达优先，不要为了短而截断句子。不要暴露你看到了“历史记录”，不要逐条复述，不要使用“你们刚才说/我看到/有人提到/关于/听起来你们在”这类总结开头，不要给人一种系统提示生成的感觉。


            输出必须使用以下格式：

            <output>

            <message>你的自然回复</message>

            </output>
      applyDefaultPrivateConfigs:
        - ${{ env.ACTIVELINK_PRIVATE_ID_2 }}
        - ${{ env.ACTIVELINK_PRIVATE_ID_1 }}
    festival:
      enabled: false
prefix:
  - /
